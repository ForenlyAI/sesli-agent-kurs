# Sesli Agent 101 lab ortamı — sürümler sabit (uv.lock); 2026-09-27 ölçüldü
python: "3.12+"
paketler: {google-genai: "2.25.0", fastapi: "0.141.1", uvicorn: "0.54.0", websockets: "16.1.1", numpy: "2.5.3", python-dotenv: "1.2.3"}
model: gemini-3.8-live            # Google AI Studio ve Vertex AI'da aynı adla var (2026-09-27 iki yolda da denendi)
ses: "Twilio Media Streams 8 kHz μ-law ↔ Gemini Live 16 kHz PCM giriş / 24 kHz PCM çıkış"
ogrenci_ortami: "GitHub Codespaces (2 çekirdek yeter; model bulutta) · yedek: kendi bilgisayarınızda uv sync"
hesaplar: {google: "AI Studio anahtarı (ücretsiz kota) ya da Vertex AI", twilio: "yalnız gerçek telefon denemesi için (ders 3.1–3.2) — telefonsuz test twilio_taklit.py"}
olcum:
  - {id: OLC-01, ne: "deneme_oturum.py — Türkçe cevap + bos_saat_bul araç çağrısı", sonuc: "Vertex ilk ses 1,26 sn · AI Studio 1,88 sn"}
  - {id: OLC-02, ne: "twilio_taklit.py — kopru.py üzerinden 4 turlu arama (boş saat, randevu, ad, tıbbi soru → aktarma)", sonuc: "cevap gecikmesi 0,76–1,52 sn · 4/4 doğru araç/davranış"}
  - {id: OLC-03, ne: "test_guvenlik.py — imzasız/yanlış imza/anahtarsız ses akışı", sonuc: "6/6 GEÇTİ"}
bilinen_sinir:
  - "Gerçek telefon araması bu kayıtta yapılmadı (kullanıcı kararı 2026-09-27); Twilio protokolü birebir taklit edildi"
  - "Dökümde (input transcription) kısa cümle arada başka dilde yazılabiliyor — agent'ın cevabı etkilenmedi"
